[project]
name = "repowise-docs-worker"
version = "0.1.0"
description = "RepoWise library documentation worker"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12.3,<5",
    "qdrant-client==1.16.2",
    "asyncpg>=0.29,<1",
    "jsonschema>=4,<5",
    "pyyaml>=6,<7",
    "tree-sitter-language-pack==1.14.3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.30,<1",
    "starlette>=0.51,<2",
]

[project.scripts]
repowise-docs = "repowise.docs.cli:main"
repowise-docs-worker = "repowise.docs.transport.http_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repowise"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires running backing services", "eval: live retrieval quality checks"]
