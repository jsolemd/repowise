name: Documentation backend
on:
  push:
    branches: [main, develop, solemd-source-search]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --extra docs --python 3.13
      - run: uv run --frozen --extra docs pytest tests/docs tests/unit/server/test_docs_libraries.py tests/unit/server/mcp/test_docs.py -m 'not integration and not eval' -q
      - run: docker build -t repowise-docs:test packages/docs
      - run: docker run --rm repowise-docs:test python -c 'from repowise.docs.transport.http_server import create_app; assert create_app()'
      - name: Exercise schema compatibility on PostgreSQL
        run: |
          docker network create docs-test
          docker build -t repowise-docs-db:test packages/docs/database
          docker run -d --name docs-test-db --network docs-test --tmpfs /var/lib/postgresql/data -e POSTGRES_USER=doc_search -e POSTGRES_PASSWORD=doc_search -e POSTGRES_DB=doc_search repowise-docs-db:test
          timeout 60s bash -c 'until docker exec docs-test-db pg_isready -h 127.0.0.1 -U doc_search -d doc_search; do sleep 1; done'
          docker run --rm -i --network docs-test -e DOC_SEARCH_POSTGRES_DSN=postgresql://doc_search:doc_search@docs-test-db:5432/doc_search repowise-docs:test python - <<'PYTHON'
          import asyncio
          from repowise.docs.db_runtime import init_pool, close_pool
          from repowise.docs.tools.documents import list_document_page
          async def verify():
              for _ in range(2):
                  pool = await init_pool()
                  async with pool.acquire() as conn:
                      assert await conn.fetchval("SELECT count(*) FROM doc_search.libraries") == 0
                  assert await list_document_page("/missing/library", "", 0, 50) == ([], 0)
                  await close_pool()
          asyncio.run(verify())
          PYTHON
